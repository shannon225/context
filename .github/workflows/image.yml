name: Build and publish Context image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the jars are present
        run: |
          missing=0
          for jar in libs/maccoss/encyclopedia/6.9.23/encyclopedia-6.9.23.jar \
                     libs/org/searlelab/msrawjava-core-nolice/26.7.31/msrawjava-core-nolice-26.7.31.jar; do
            if [ ! -s "$jar" ]; then echo "missing or empty: $jar"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::The EncyclopeDIA jars are not in the checkout. They are needed to build."
            exit 1
          fi

      - name: Work out the image name
        id: image
        run: echo "name=$(echo '${{ github.repository_owner }}/context' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Work out the version, if this is a tag
        id: version
        run: |
          case "${{ github.ref }}" in
            refs/tags/v*) ;;
            *) echo "number=" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          pom="$(python3 -c "import xml.etree.ElementTree as ET; \
            ns='{http://maven.apache.org/POM/4.0.0}'; \
            print(ET.parse('pom.xml').getroot().find(ns+'version').text)")"
          echo "tag $GITHUB_REF_NAME -> $version, pom.xml -> $pom"
          if [ "$version" != "${pom%-SNAPSHOT}" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' and pom.xml version '$pom' disagree. Either tag v${pom%-SNAPSHOT}, or set <version> in pom.xml to ${version}-SNAPSHOT and commit that first."
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build, and push unless this is a pull request
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            VERSION=${{ steps.version.outputs.number }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          tag="$(echo '${{ steps.meta.outputs.tags }}' | head -1)"
          docker run --rm "$tag" --help
          docker run --rm "$tag" percolator -h
          docker run --rm "$tag" mprophet -h
          docker run --rm --entrypoint pyisopep "$tag" --help

      - name: Refuse to publish Thermo binaries
        run: |
          tag="$(echo '${{ steps.meta.outputs.tags }}' | head -1)"
          cid="$(docker create "$tag")"
          docker cp "$cid:/opt/context/context.jar" ./published.jar
          docker rm "$cid" > /dev/null
          count="$(unzip -l ./published.jar | grep -c 'msraw/thermo/' || true)"
          echo "Thermo entries in the published jar: $count"
          if [ "$count" != "0" ]; then
            echo "::error::This image bundles Thermo RawFileReader and must not be published. Was -Pthermo used?"
            exit 1
          fi
